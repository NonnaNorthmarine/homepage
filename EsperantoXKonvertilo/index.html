<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エスペラント X方式 リアルタイム変換器</title>
  <meta name="description" content="X方式（x-sistemo）で入力されたエスペラント語を、リアルタイムに特殊文字（ĉ, ĝ, ĥ, ĵ, ŝ, ŭ）へ変換するWebツール。完全ローカル処理。">

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#059669">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X-Konvertilo">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-decorations">
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="logo-icon">
          <span class="esperanto-star">★</span>
        </div>
        <div class="header-text">
          <h1 class="app-title">Esperanto X-Konvertilo</h1>
          <p class="app-subtitle">エスペラント語 X方式 リアルタイム変換</p>
        </div>
      </div>
      <div class="header-actions">
        <!-- Install PWA Button (Visible when installable) -->
        <button id="installBtn" class="action-btn install-btn hidden" title="アプリをインストール" aria-label="アプリをインストール">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>インストール</span>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="icon-btn" title="テーマ切り替え" aria-label="テーマ切り替え">
          <svg id="themeIconSun" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="themeIconMoon" class="theme-icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace Grid -->
    <main class="converter-grid">
      <!-- Input Panel -->
      <section class="panel-card input-panel">
        <div class="panel-header">
          <div class="panel-title-wrap">
            <span class="badge badge-input">入力</span>
            <h2 class="panel-title">X方式（X-sistemo）</h2>
          </div>
          <div class="panel-actions">
            <button id="clearBtn" class="action-btn text-btn" title="入力をクリア" aria-label="入力をクリア">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              <span>クリア</span>
            </button>
          </div>
        </div>
        <div class="textarea-wrapper">
          <textarea
            id="inputText"
            class="converter-textarea"
            placeholder="ここにX方式のエスペラント文を入力してください... (例: Bonan tagon! Cxirkaux la domo estas bela gxardeno.)"
            autofocus
            spellcheck="false"
          ></textarea>
        </div>
      </section>

      <!-- Center Indicator -->
      <div class="converter-arrow-container" aria-hidden="true">
        <div class="converter-arrow-bubble">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" class="arrow-line-desktop"></line>
            <polyline points="12 5 19 12 12 19" class="arrow-head-desktop"></polyline>
            <line x1="12" y1="5" x2="12" y2="19" class="arrow-line-mobile"></line>
            <polyline points="5 12 12 19 19 12" class="arrow-head-mobile"></polyline>
          </svg>
        </div>
      </div>

      <!-- Output Panel -->
      <section class="panel-card output-panel">
        <div class="panel-header">
          <div class="panel-title-wrap">
            <span class="badge badge-output">出力</span>
            <h2 class="panel-title">エスペラント特殊文字</h2>
          </div>
          <div class="panel-actions">
            <button id="copyBtn" class="action-btn primary-action-btn" title="変換結果をコピー" aria-label="変換結果をコピー">
              <svg class="copy-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <svg class="check-icon hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span id="copyBtnText">コピー</span>
            </button>
          </div>
        </div>
        <div class="textarea-wrapper">
          <textarea
            id="outputText"
            class="converter-textarea output-textarea"
            placeholder="変換結果がリアルタイムにここに表示されます..."
            readonly
            spellcheck="false"
          ></textarea>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>完全ローカルブラウザ処理 • オフライン・PWAインストール対応</p>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMessage">コピーしました！</span>
  </div>

  <script src="converter.js"></script>
</body>
</html>
